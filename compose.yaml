name: oficina-auth-local
services:
  auth-postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:?Configure AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER:?Configure AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Configure uma senha local}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5544}:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  auth-data:

