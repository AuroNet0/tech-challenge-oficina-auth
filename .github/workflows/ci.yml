name: Productive build verification

"on":
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      IMAGE: oficina-auth:ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test build verifier
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Build productive Linux image from source
        run: |
          docker build --platform linux/amd64 --pull=false \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" .
      - name: Full Maven suite and JaCoCo gate
        run: mvn -B -ntp clean verify -Dauth.internal.image="$IMAGE"
      - name: SonarCloud analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error::SONAR_TOKEN esta vazio. Configure o secret SONAR_TOKEN para executar a analise SonarCloud."
            exit 1
          fi
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=auronet0 \
            -Dsonar.projectKey=AuroNet0_tech-challenge-oficina-auth \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=false
      - name: Verify reports, package, image and local provenance
        run: python -B scripts/verify_build.py --image "$IMAGE"
      - name: Write sanitized test summary even on failure
        if: always()
        run: python -B scripts/verify_build.py --test-summary
      - name: Upload non-sensitive verification summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: |
            target/build-evidence.json
            target/test-summary.json
          if-no-files-found: warn
          retention-days: 7
