name: Auth CI/CD

on:
  push:
    branches:
      - homolog
      - main
  pull_request:
    branches:
      - homolog
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TERRAFORM_DIR: terraform
  LAMBDA_JAR: target/tech-challenge-oficina-auth.jar

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Select Maven command
        id: maven
        shell: bash
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "cmd=./mvnw" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=mvn" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: ${{ steps.maven.outputs.cmd }} -B test

      - name: Build package
        run: ${{ steps.maven.outputs.cmd }} -B package -DskipTests

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform fmt -check

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform validate

      - name: Upload Lambda JAR
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jar
          path: ${{ env.LAMBDA_JAR }}
          if-no-files-found: error

  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref_name == 'homolog' || github.ref_name == 'main')
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda JAR
        uses: actions/download-artifact@v4
        with:
          name: lambda-jar
          path: target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: terraform apply -auto-approve -input=false
